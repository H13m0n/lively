name: Resource efficiency

on:
  push:
    branches: [codex/resource-efficiency]
  pull_request:
    paths:
      - src/Lively/**
      - global.json
      - .github/workflows/resource-efficiency.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test playback commands, suspension and IPC
        run: dotnet test src/Lively/Lively.Tests/Lively.Tests.csproj -c Release --verbosity minimal
      - name: Build Windows core
        run: dotnet build src/Lively/Lively/Lively.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 --verbosity minimal
